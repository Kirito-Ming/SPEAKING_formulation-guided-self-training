[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "formulation-guided-self-training"
version = "1.0.0"
description = "Minimal inference reproduction for formulation-guided self-training"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate==1.10.1",
  "pandas==2.3.2",
  "pyarrow==21.0.0",
  "safetensors==0.6.2",
  "torch==2.8.0",
  "transformers==4.56.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["fgst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
